name: Weekly conference URL discovery reminder

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout conference data
        uses: actions/checkout@v4

      - name: Refresh discovery reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Monthly Codex check: conference URL discovery";
            const { owner, repo } = context.repo;

            const existing = await github.rest.search.issuesAndPullRequests({
              q: [
                `repo:${owner}/${repo}`,
                "is:issue",
                "is:open",
                `"${title}"`,
              ].join(" "),
            });

            const desiredLabels = [
              {
                name: "maintenance",
                color: "0e8a16",
                description: "Repository maintenance task",
              },
              {
                name: "codex-review",
                color: "5319e7",
                description: "Needs local Codex-assisted review",
              },
            ];
            const currentLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { owner, repo, per_page: 100 },
            );
            const currentLabelNames = new Set(
              currentLabels.map((label) => label.name),
            );

            for (const label of desiredLabels) {
              if (currentLabelNames.has(label.name)) continue;
              await github.rest.issues.createLabel({ owner, repo, ...label });
            }

            const fs = require("fs");
            const conferences = JSON.parse(fs.readFileSync("data/conferences.json", "utf8"));
            const unknown = conferences.filter(c => c.fullDeadline === "N/A");
            const oldUrl = c => /20(2[0-6])/.test(c.url || "");
            unknown.sort((a, b) => Number(oldUrl(b)) - Number(oldUrl(a)) || a.acronym.localeCompare(b.acronym));
            const body = [
              "Weekly review as of " + new Date().toISOString().slice(0, 10) + ": " + unknown.length + "/" + conferences.length + " full-paper deadlines are N/A.",
              "Check all unknown dates against the current official research-track CFP. Prior editions and snippets are not evidence.",
              "",
              "Rules:",
              "- Do not add or remove conference entries.",
              "- Keep `data/conferences.json` as the fixed CORE/ICORE genre master list.",
              "- Update only `url`, `deadline`, `fullDeadline`, and, when justified, `rating`.",
              "- Changing `deadline` or `fullDeadline` to `N/A` is allowed when the date cannot be confirmed.",
              "- If only the abstract deadline has passed, keep the dates.",
              "- If the full paper deadline has passed, reset both `deadline` and `fullDeadline` to `N/A` while keeping the conference entry.",
              "",
              "Suggested local Codex task:",
              "",
              "```text",
              "Use the repository skill `conference-url-discovery`.",
              "Review data/conferences.json for existing conferences whose URL is old, generic, or whose fullDeadline is N/A.",
              "Review all entries; prioritize A*, A, then B-ranked conferences.",
              "Search for newly published official CFP / important dates / research track pages.",
              "If a better URL or confirmed deadline is found, update data/conferences.json, run scripts/build_site.py and scripts/summarize_changes.py, then prepare a PR.",
              "Do not add or remove conference entries.",
              "```",
              "",
              "Keep this issue open while unresolved entries remain.",
              "## N/A entries (old-year URLs first)",
              ...unknown.map(c => "- [ ] " + c.acronym + " — " + c.url),
            ].join("\n");

            if (existing.data.total_count > 0) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.data.items[0].number, body,
              });
              core.info("Refreshed the existing discovery issue.");
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: desiredLabels.map((label) => label.name),
            });
